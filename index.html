<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пиано учител</title>
<style>
:root{
  --bg:#0f1220; --panel:#181c30; --panel-2:#222843; --ink:#eceefa; --muted:#9097bd; --border:#2e3558;
  --accent:#5b8cff; --good:#34d17c; --bad:#ff5d6c; --warn:#ffbf4d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:#4a5596}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.on{background:#2a3a73;border-color:var(--accent)}
.app{max-width:1280px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:7px 12px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
label b{color:var(--ink);min-width:2.2em}
input[type=range]{accent-color:var(--accent);width:120px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.songbtn{display:flex;flex-direction:column;align-items:flex-start;min-width:230px;text-align:left;padding:6px 14px}
.songbtn span{font-weight:600}
.songbtn small{color:var(--muted);font-size:12px}
.meter{width:110px;height:8px;background:#0b0e1a;border-radius:4px;overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--good),var(--warn) 70%,var(--bad))}
#heard{min-width:8em;font-weight:600;color:var(--ink)}
#inStatus{color:var(--muted);font-size:14px}
#diag{color:var(--muted);font-size:13px}
.calbar{height:6px;background:#0b0e1a;border-radius:3px;overflow:hidden;margin:10px 0}
.calbar i{display:block;height:100%;background:var(--accent)}
.mini{--kw:42px;--bw:26px;position:relative;display:flex;width:max-content;margin:14px auto 4px}
.mini .w{width:var(--kw);height:124px;background:#f7f7fb;border:1px solid #b9bdd6;border-radius:0 0 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;padding-bottom:8px;color:#1d1f2b;font-weight:700;font-size:13px}
.mini .w .n{width:22px;height:22px;border-radius:50%;background:#e1e4f3;display:flex;align-items:center;justify-content:center;font-size:12px}
.mini .w.cur{background:#9dbaff;animation:pulse 1s ease-in-out infinite alternate}
.mini .w.cur .n{background:var(--accent);color:#fff}
.mini .w.done{background:#c8f3da}
.mini .w.done .n{background:var(--good);color:#fff}
.mini .b{position:absolute;top:0;width:var(--bw);height:74px;background:#15182a;border-radius:0 0 5px 5px}
.mini-hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.mini .w.hb{background:#ffb3bb;animation:none}
.mini .w.hg{background:#8ee8b3;animation:none}
.mini .b.hb{background:#ff5d6c}
.mini .b.hg{background:#34d17c}
@keyframes pulse{from{background:#9dbaff}to{background:#c3d4ff}}
@media (max-width:440px){.mini{--kw:34px;--bw:21px}}
.card .ok{color:var(--good);font-weight:600}
.card .no{color:var(--warn);font-weight:600}
.prompt{font-size:22px;font-weight:700;min-height:34px;text-align:center}
.prompt .dim{color:var(--muted);font-weight:500;font-size:16px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#fbf8f1;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#staff{display:block;width:100%;height:290px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,18,32,.5);backdrop-filter:blur(2px)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 24px;max-width:460px;text-align:center}
.card h2{margin:0 0 4px;font-size:22px}
.card p{margin:6px 0;color:var(--muted)}
.card .big{font-size:40px;font-weight:800;color:var(--ink);margin:6px 0}
.card .stars{font-size:28px;color:var(--warn);letter-spacing:4px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;color:var(--muted);font-size:14px}
.stats b{color:var(--ink)}
#kb{display:block;width:100%;height:150px;border-radius:10px}
.hint{color:var(--muted);font-size:13px;margin:0;text-align:center}
.hint kbd{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:0 5px;font:inherit;font-size:12px;color:var(--ink)}
/* library */
.lib{position:fixed;inset:0;background:rgba(8,10,20,.8);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow:auto;z-index:10}
.lib.cal{align-items:center}
.lib.cal .card{max-width:520px;width:100%}
.lib-inner{background:var(--panel);border:1px solid var(--border);border-radius:18px;max-width:980px;width:100%;padding:18px 20px 22px}
.lib-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lib-head h2{margin:0;margin-right:auto;font-size:20px}
.lib h3{margin:18px 0 8px;font-size:15px;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:baseline}
.lib h3 .lvl{color:var(--warn);letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.song{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);cursor:pointer}
.song:hover{border-color:#4a5596}
.song .stars{color:var(--warn);font-size:12px;letter-spacing:1px}
.song .del{position:absolute;top:6px;right:8px;color:var(--muted);padding:2px 6px;border-radius:6px}
.song .del:hover{color:var(--bad);background:#2a1d2a}
.imp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;margin:8px 0 4px;background:var(--panel-2);border-radius:12px}
.imp input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 8px;width:150px}
#impMsg{font-size:13px;color:var(--muted)}
.song.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.song b{font-size:15px}
.song small{color:var(--muted);font-size:12px}
.song .best{color:var(--good);font-size:12px;font-weight:600}
@media (max-width:700px){
  #staff{height:270px}
  #kb{height:110px}
  .brand{width:100%}
  .stats{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">🎹 Пиано учител</div>
    <button id="btnLib" class="songbtn"><span id="songTitle">—</span><small id="songMeta">Избери песен</small></button>
    <div class="seg" id="hands" title="Коя ръка упражняваш">
      <button data-v="R">Дясна</button><button data-v="L">Лява</button><button data-v="both">Двете</button>
    </div>
    <div class="seg" id="mode" title="Как тече песента">
      <button data-v="wait">Изчаква ме</button><button data-v="realtime">В темп</button>
    </div>
  </header>

  <div class="panel row">
    <label>Темпо <input type="range" id="tempo" min="30" max="180" step="1"><b id="tempoVal">90</b></label>
    <label><input type="checkbox" id="optNames" checked> Имена на нотите</label>
    <label><input type="checkbox" id="optMetro" checked> Метроном</label>
    <label title="Когато упражняваш една ръка, компютърът свири другата"><input type="checkbox" id="optAccomp" checked> Компютърът свири другата ръка</label>
  </div>

  <div class="panel row">
    <button id="btnMic">🎤 Включи микрофона</button>
    <button id="btnCal">🎚 Настройка</button>
    <span id="inStatus">Сложи телефона или лаптопа близо до пианото и включи микрофона.</span>
    <span id="micBox" class="row" hidden>
      <span class="meter" title="Сила на звука"><i id="meterFill"></i></span>
      <span>Чувам: <span id="heard">—</span></span>
      <label title="При акустично пиано микрофонът понякога бърка октавата"><input type="checkbox" id="optOctave" checked> Приемай друга октава</label>
      <label>Чувствителност <input type="range" id="sens" min="1" max="10" value="5"></label>
      <span id="diag"></span>
    </span>
  </div>

  <div class="prompt" id="prompt"></div>

  <div class="stage">
    <canvas id="staff"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="transport">
    <button id="btnPlay" class="primary">▶ Старт</button>
    <button id="btnRestart">↺ Отначало</button>
    <button id="btnDemo">👂 Чуй как звучи</button>
    <div class="stats">
      <span>Точни <b id="stHit">0</b></span>
      <span>Грешни <b id="stWrong">0</b></span>
      <span>Пропуснати <b id="stMiss">0</b></span>
      <span>Серия <b id="stStreak">0</b></span>
      <span>Точност <b id="stAcc">—</b></span>
    </div>
  </div>

  <canvas id="kb"></canvas>
  <p class="hint">Синият клавиш е нотата, която трябва да изсвириш · <kbd>Интервал</kbd> старт/пауза</p>
</div>

<div class="lib cal" id="calModal" hidden></div>

<div class="lib" id="lib" hidden>
  <div class="lib-inner">
    <div class="lib-head"><h2>📚 Песни</h2><button id="btnLibClose">Затвори</button></div>
    <div class="imp">
      <button id="btnImport">📁 Внеси MIDI файл</button>
      <label>в секция <input id="impCat" type="text" value="Хари Потър"></label>
      <input type="file" id="impFile" accept=".mid,.midi,audio/midi,audio/x-midi" multiple hidden>
      <span id="impMsg"></span>
    </div>
    <div id="libBody"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ============================================================
   Music helpers
   ============================================================ */
const PCS = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
const LETTERS = 'CDEFGAB';
const BG = ['До','Ре','Ми','Фа','Сол','Ла','Си'];
const SHARP_IDX = [0,0,1,1,2,3,3,4,4,5,5,6];
const SHARP_ACC = [0,1,0,1,0,0,1,0,1,0,1,0];

function parseNote(s) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(s);
  if (!m) throw new Error('Лоша нота: ' + s);
  const oct = +m[3], acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
  const li = LETTERS.indexOf(m[1]);
  return { midi: (oct + 1) * 12 + PCS[m[1]] + acc, diat: oct * 7 + li, letter: m[1], acc };
}
const FLAT_IDX = [0,1,1,2,2,3,4,4,5,5,6,6];
const FLAT_ACC = [0,-1,0,-1,0,0,-1,0,-1,0,-1,0];
function midiInfo(m, flats) {
  const pc = ((m % 12) + 12) % 12, oct = Math.floor(m / 12) - 1;
  const li = (flats ? FLAT_IDX : SHARP_IDX)[pc];
  return { midi: m, diat: oct * 7 + li, letter: LETTERS[li], acc: (flats ? FLAT_ACC : SHARP_ACC)[pc], oct };
}
function noteName(n, withOct) {
  const li = LETTERS.indexOf(n.letter);
  const acc = n.acc > 0 ? '♯' : n.acc < 0 ? '♭' : '';
  return BG[li] + acc + (withOct ? (Math.floor(n.diat / 7)) : '');
}
const midiName = (m, withOct) => noteName(midiInfo(m), withOct);

const parseDur = x => { const [a, b] = x.split('/'); return b === undefined ? parseFloat(a) : parseFloat(a) / parseFloat(b); };
// "C4:1 D4:0.5 E4:1/3 R:1 C3+E3+G3:2 | ..." -> notes (durations in quarter-note beats)
function parsePart(str, hand, start) {
  const out = []; let t = start || 0;
  for (const tok of str.trim().split(/\s+/)) {
    if (!tok || tok === '|') continue;
    const i = tok.lastIndexOf(':');
    const head = tok.slice(0, i), dur = parseDur(tok.slice(i + 1));
    if (!(dur > 0)) throw new Error('Лоша дължина: ' + tok);
    if (head !== 'R') for (const nn of head.split('+')) out.push({ ...parseNote(nn), beat: t, dur, hand });
    t += dur;
  }
  return out;
}

/* ============================================================
   Song library (public-domain melodies, simple arrangements)
   ============================================================ */
function preludeParts() {
  const bars = [
    ['C4+E4', 'G4 C5 E5'], ['C4+D4', 'A4 D5 F5'], ['B3+D4', 'G4 D5 F5'], ['C4+E4', 'G4 C5 E5'],
    ['C4+E4', 'A4 E5 A5'], ['C4+D4', 'F#4 A4 D5'], ['B3+D4', 'G4 D5 G5'], ['B3+C4', 'E4 G4 C5'],
  ];
  let rh = [], lh = [];
  for (const [l, r] of bars) {
    const [a, b, c] = r.split(' ');
    const half = `R:0.5 ${a}:0.25 ${b}:0.25 ${c}:0.25 ${a}:0.25 ${b}:0.25 ${c}:0.25`;
    rh.push(half + ' ' + half); lh.push(`${l}:2 ${l}:2`);
  }
  rh.push('C5+E5+G5:4'); lh.push('C3+C4:4');
  return { rh: rh.join(' | '), lh: lh.join(' | ') };
}
const PRELUDE = preludeParts();

const triplets = (...groups) => groups.map(([a, b, c]) => `${a}:1/3 ${b}:1/3 ${c}:1/3`).join(' ');
const MOUNTAIN_RH = 'B3:0.5 C#4:0.5 D4:0.5 E4:0.5 F#4:0.5 D4:0.5 F#4:1 | E#4:0.5 C#4:0.5 E#4:1 E4:0.5 C4:0.5 E4:1 | B3:0.5 C#4:0.5 D4:0.5 E4:0.5 F#4:0.5 D4:0.5 F#4:0.5 B4:0.5 | A4:0.5 F#4:0.5 D4:0.5 F#4:0.5 A4:2';
const MOUNTAIN_LH = 'B2:1 F#2:1 B2:1 F#2:1 | C#3:2 C3:2 | B2:1 F#2:1 B2:1 F#2:1 | D3:2 F#2:2';
const BELLS = 'Bb4:1 A4:0.5 Bb4:0.5 G4:1', BELLS_HI = 'D5:1 C5:0.5 D5:0.5 Bb4:1', BELLS_LH = 'Bb3:1 A3:0.5 Bb3:0.5 G3:1';
const rpt = (x, n) => Array(n).fill(x).join(' | ');

const LEVELS = {1: 'Първи стъпки', 2: 'Лесни', 3: 'Средни', 4: 'Предизвикателство'};
const SECTIONS = { one: '✋ Една ръка — за начинаещи', magic: '🪄 Магия' };
const SONGS = [
  { id:'hotcross', cat:'one', level:1, title:'Горещи кифлички', composer:'Народна, Англия', bpm:90, bpb:4,
    rh:'E4:1 D4:1 C4:2 | E4:1 D4:1 C4:2 | C4:0.5 C4:0.5 C4:0.5 C4:0.5 D4:0.5 D4:0.5 D4:0.5 D4:0.5 | E4:1 D4:1 C4:2' },
  { id:'entchen', cat:'one', level:1, title:'Всички мои патенца', composer:'Народна, Германия', bpm:100, bpb:4,
    rh:'C4:1 D4:1 E4:1 F4:1 | G4:2 G4:2 | A4:1 A4:1 A4:1 A4:1 | G4:4 | A4:1 A4:1 A4:1 A4:1 | G4:4 | F4:1 F4:1 F4:1 F4:1 | E4:2 E4:2 | D4:1 D4:1 D4:1 D4:1 | C4:4' },
  { id:'hans', cat:'one', level:1, title:'Малкият Ханс', composer:'Народна, Германия', bpm:100, bpb:4,
    rh:'G4:1 E4:1 E4:2 | F4:1 D4:1 D4:2 | C4:1 D4:1 E4:1 F4:1 | G4:1 G4:1 G4:2 | G4:1 E4:1 E4:2 | F4:1 D4:1 D4:2 | C4:1 E4:1 G4:1 G4:1 | C4:4' },
  { id:'lune', cat:'one', level:1, title:'На лунна светлина', composer:'Народна, Франция', bpm:90, bpb:4,
    rh:'C4:1 C4:1 C4:1 D4:1 | E4:2 D4:2 | C4:1 E4:1 D4:1 D4:1 | C4:4 | C4:1 C4:1 C4:1 D4:1 | E4:2 D4:2 | C4:1 E4:1 D4:1 D4:1 | C4:4 | D4:1 D4:1 D4:1 D4:1 | A3:2 A3:2 | D4:1 C4:1 B3:1 A3:1 | G3:4 | C4:1 C4:1 C4:1 D4:1 | E4:2 D4:2 | C4:1 E4:1 D4:1 D4:1 | C4:4' },
  { id:'macdonald', cat:'one', level:1, title:'Старият Макдоналд', composer:'Народна, САЩ', bpm:100, bpb:4,
    rh:'G4:1 G4:1 G4:1 D4:1 | E4:1 E4:1 D4:2 | B4:1 B4:1 A4:1 A4:1 | G4:3 D4:1 | G4:1 G4:1 G4:1 D4:1 | E4:1 E4:1 D4:2 | B4:1 B4:1 A4:1 A4:1 | G4:4' },
  { id:'row', cat:'one', level:1, title:'Гребе, гребе лодката', composer:'Народна, Англия', bpm:90, bpb:3, ts:'6/8', tick:1.5,
    rh:'C4:1.5 C4:1.5 | C4:1 D4:0.5 E4:1.5 | E4:1 D4:0.5 E4:1 F4:0.5 | G4:3 | C5:0.5 C5:0.5 C5:0.5 G4:0.5 G4:0.5 G4:0.5 | E4:0.5 E4:0.5 E4:0.5 C4:0.5 C4:0.5 C4:0.5 | G4:1 F4:0.5 E4:1 D4:0.5 | C4:3' },
  { id:'yankee', cat:'one', level:1, title:'Янки Дудъл', composer:'Народна, САЩ', bpm:110, bpb:4,
    rh:'C4:1 C4:1 D4:1 E4:1 | C4:1 E4:1 D4:1 G3:1 | C4:1 C4:1 D4:1 E4:1 | C4:2 B3:2 | C4:1 C4:1 D4:1 E4:1 | F4:1 E4:1 D4:1 C4:1 | B3:1 G3:1 A3:1 B3:1 | C4:2 C4:2' },

  { id:'waltz', cat:'magic', level:2, title:'Вълшебен валс', composer:'Оригинална мелодия', bpm:100, bpb:3, key:['F#'],
    rh:'E5:1 D#5:0.5 E5:0.5 B4:1 | C5:1.5 B4:0.5 A4:1 | G4:1 F#4:0.5 G4:0.5 E4:1 | B4:3 | E5:1 D#5:0.5 E5:0.5 G5:1 | F#5:1.5 E5:0.5 D#5:1 | E5:1 B4:1 G4:1 | E4:3',
    lh:'E3:3 | A2:3 | E3:3 | B2:3 | E3:3 | B2:3 | E3:3 | E2+B2:3' },
  { id:'bells', cat:'magic', level:2, title:'Звънчетата (Щедрик)', composer:'Микола Леонтович', bpm:110, bpb:3, key:['Bb','Eb'],
    rh:`${rpt(BELLS, 4)} | ${rpt(BELLS_HI, 4)} | G4+Bb4+D5:3`,
    lh:`${rpt('G3:3', 4)} | ${rpt(BELLS_LH, 4)} | G2+G3:3` },
  { id:'mountain', cat:'magic', level:3, title:'В пещерата на планинския цар', composer:'Едвард Григ', bpm:100, bpb:4, key:['F#','C#'], zoom:1.3,
    rh:`${MOUNTAIN_RH} | ${MOUNTAIN_RH} | B3+D4+F#4:4`, lh:`${MOUNTAIN_LH} | ${MOUNTAIN_LH} | B2:4` },
  { id:'toccata', cat:'magic', level:3, title:'Токата в ре минор', composer:'Йохан Себастиан Бах', bpm:60, bpb:4, key:['Bb'], zoom:1.4,

function buildNotes(song) {
  const notes = song.data
    ? song.data.map(d => ({ ...midiInfo(d.midi, song.flats), beat: d.beat, dur: d.dur, hand: d.hand }))
    : [...parsePart(song.rh, 'R', 0), ...(song.lh ? parsePart(song.lh, 'L', song.lhStart || 0) : [])];
  notes.sort((a, b) => a.beat - b.beat || (a.hand === 'L' ? -1 : 1) || a.midi - b.midi);
  notes.forEach((n, i) => { n.id = i; n.state = 'pending'; });
  return notes;
}
// dev check: every "|"-separated bar must add up to bpb (the first may be a pickup)
function validateSongs() {
  const issues = [];
  for (const s of SONGS.filter(x => x.rh)) for (const [hand, str, start] of [['R', s.rh, 0], ['L', s.lh, s.lhStart || 0]]) {
    if (!str) continue;
    try { parsePart(str, hand, 0); } catch (e) { issues.push(`${s.id}/${hand}: ${e.message}`); continue; }
    str.split('|').forEach((bar, i) => {
      const sum = bar.trim().split(/\s+/).filter(Boolean).reduce((a, t) => a + parseDur(t.slice(t.lastIndexOf(':') + 1)), 0);
      const pickupBar = i === 0 && hand === 'R' && s.pickup;
      const want = pickupBar ? s.pickup : s.bpb;
      if (Math.abs(sum - want) > 1e-6) issues.push(`${s.id}/${hand} такт ${i + 1}: ${sum} вместо ${want}`);
    });
    if (hand === 'L' && Math.abs((start || 0) - (s.pickup || 0)) > 1e-6) issues.push(`${s.id}: lhStart ≠ pickup`);
  }
  return issues;
}

/* ============================================================
   Audio: context, sampled piano (Salamander Grand, CC-BY), metronome
   ============================================================ */
let actx = null, masterGain = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain(); masterGain.gain.value = 0.9; masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const SAMPLE_BASE = 'https://tonejs.github.io/audio/salamander/';
const SAMPLES = [];
for (let o = 1; o <= 7; o++) for (const [n, pc] of [['C', 0], ['Ds', 3], ['Fs', 6], ['A', 9]]) SAMPLES.push({ name: n + o, midi: (o + 1) * 12 + pc });
const piano = { buffers: new Map(), keys: [], loading: null, ready: false };
function loadPiano() {
  if (piano.loading) return piano.loading;
  const c = audio();
  piano.loading = Promise.all(SAMPLES.map(async s => {
    try {
      const r = await fetch(SAMPLE_BASE + s.name + '.mp3');
      if (!r.ok) return;
      piano.buffers.set(s.midi, await c.decodeAudioData(await r.arrayBuffer()));
    } catch (e) { /* fall back to the synth for this range */ }
  })).then(() => {
    piano.keys = [...piano.buffers.keys()].sort((a, b) => a - b);
    piano.ready = piano.keys.length >= 10;
  });
  return piano.loading;
}
function playNote(m, dur = 0.6, when = 0, vel = 0.8, ctx = null, dest = null, detune = 0) {
  ctx = ctx || audio(); dest = dest || (ctx === actx ? masterGain : ctx.destination);
  const t = Math.max(when, ctx.currentTime);
  const rel = t + Math.max(0.25, dur);
  if (piano.ready) {
    let s = piano.keys[0];
    for (const k of piano.keys) if (Math.abs(k - m) < Math.abs(s - m)) s = k;
    const src = ctx.createBufferSource();
    src.buffer = piano.buffers.get(s);
    src.playbackRate.value = 2 ** ((m - s) / 12 + detune / 1200);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vel, t); g.gain.setValueAtTime(vel, rel);
    g.gain.exponentialRampToValueAtTime(0.001, rel + 0.5);
    src.connect(g).connect(dest); src.start(t); src.stop(rel + 0.6);
    return;
  }
  const f = 440 * 2 ** ((m - 69) / 12);
  const g = ctx.createGain(), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(Math.min(9000, f * 8), t); lp.frequency.exponentialRampToValueAtTime(Math.max(400, f * 2), t + 1);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * 0.3, t + 0.006);
  g.gain.exponentialRampToValueAtTime(vel * 0.1, t + 0.35); g.gain.setValueAtTime(vel * 0.1, rel);
  g.gain.exponentialRampToValueAtTime(0.0005, rel + 0.5);
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.35;
  o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g).connect(dest);
  o1.start(t); o2.start(t); o1.stop(rel + 0.6); o2.stop(rel + 0.6);
}
function click(accent) {
  const c = audio(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = accent ? 1760 : 1175;
  g.gain.setValueAtTime(accent ? 0.12 : 0.07, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.04);
  o.connect(g).connect(masterGain); o.start(t); o.stop(t + 0.05);
}

/* ============================================================
   Polyphonic note detector (microphone).
   On every energy onset it compares the spectrum just before the
   attack with the spectrum ~100ms after it. Only what was newly struck
   remains (ringing notes decay, so they cancel out). Pitches are then
   picked one by one by harmonic summation, and each picked note's
   harmonics are subtracted (spectral smoothness keeps octaves alive).
   ============================================================ */
function makeFFT(N) {
  const lev = Math.log2(N), rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) { let r = 0, x = i; for (let b = 0; b < lev; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
  const cs = new Float32Array(N / 2), sn = new Float32Array(N / 2);
  for (let i = 0; i < N / 2; i++) { cs[i] = Math.cos(2 * Math.PI * i / N); sn[i] = -Math.sin(2 * Math.PI * i / N); }
  return (re, im) => {
    for (let i = 0; i < N; i++) { const j = rev[i]; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= N; size <<= 1) {
      const half = size >> 1, step = N / size;
      for (let i = 0; i < N; i += size) for (let j = 0, k = 0; j < half; j++, k += step) {

  if (S.beat > S.endBeat + 0.6 && (S.demo || nextGroupBeat() === null)) finish();
}

// One strike on the piano can produce several detected notes (a chord). If any of them is
// a note we were waiting for, the extras are treated as detector noise; if none is, the
// strike counts as a single wrong note.
function onStrike(midis, tEvent) {
  const now = performance.now();
  if (!S.playing || S.demo) { for (const m of midis) S.flash.set(m, { kind: 'neutral', until: now + 700 }); return; }
  const hits = midis.filter(m => tryHit(m, tEvent));
  // far outside the song's range it is noise (a door, a voice, a string's overtone), not a wrong key
  const plausible = midis.filter(m => m >= S.songLo - 5 && m <= S.songHi + 5);
  if (!hits.length && plausible.length) wrongNote(plausible[0]);
  updateStats(); updatePrompt();
}
function tryHit(midi, tEvent) {
  const now = performance.now();
  const lenient = $('#optOctave').checked;
  const exact = n => n.midi === midi, loose = n => lenient && (n.midi - midi) % 12 === 0;
  let cand = null, offSec = 0;
  if (S.mode === 'realtime') {
    const lag = nowSec() - tEvent + 0.03; // detection happens ~170ms after the strike
    const beatAt = S.beat - lag * bps(), win = HIT_WIN * bps();
    const near = S.notes.filter(n => n.state === 'pending' && isActive(n) && Math.abs(n.beat - beatAt) <= win);
    const pick = f => near.filter(f).sort((a, b) => Math.abs(a.beat - beatAt) - Math.abs(b.beat - beatAt))[0];
    cand = pick(exact) || pick(loose) || null;
    if (cand) offSec = (beatAt - cand.beat) / bps();
  } else {
    const g = nextGroupBeat();
    if (g !== null && g - S.beat <= 1) {
      const grp = S.notes.filter(n => n.state === 'pending' && isActive(n) && Math.abs(n.beat - g) < 1e-6);
      cand = grp.find(exact) || grp.find(loose) || null;
    }
  }
  if (cand) {
    cand.state = 'hit'; S.stats.hit++; S.streak++;
    if (lenient) for (const n of S.notes) // hands in octaves: the mic cannot tell them apart
      if (n !== cand && n.state === 'pending' && isActive(n) && Math.abs(n.beat - cand.beat) < 1e-6 && (n.midi - midi) % 12 === 0) { n.state = 'hit'; S.stats.hit++; }
    S.flash.set(midi, { kind: 'good', until: now + 700 });
    let text = S.streak >= 5 && S.streak % 5 === 0 ? `Серия ${S.streak}!` : '✓';
    if (S.mode === 'realtime') {
      S.stats.offsets.push(offSec);
      const a = Math.abs(offSec);
      text = a < 0.07 ? 'Перфектно!' : a < 0.14 ? 'Добре' : offSec < 0 ? 'Рано' : 'Късно';
    }
    S.feedback.push({ text, color: '#17a34a', t: now });
    return true;
  }
  return false;
}
function wrongNote(midi) {
  const now = performance.now();
  S.stats.wrong++; S.streak = 0;
  S.flash.set(midi, { kind: 'bad', until: now + 700 });
  S.ghosts.push({ midi, t: now });
  S.feedback.push({ text: midiName(midi) + '?', color: '#dc3545', t: now });
}

/* ============================================================
   Input: microphone
   ============================================================ */
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (!$('#lib').hidden || calib.c) return; togglePlay(); }
  else if (e.code === 'Escape') $('#lib').hidden = true;

const mic = { active: false, stream: null, analyser: null, buf: null, det: null, heard: [] };
async function toggleMic() {
  if (mic.active) {
    mic.stream.getTracks().forEach(t => t.stop());
    mic.active = false; $('#btnMic').classList.remove('on'); $('#btnMic').textContent = '🎤 Включи микрофона'; $('#micBox').hidden = true;
    setStatus('Микрофонът е изключен.');
    return;
  }
  try {
    const c = audio(); loadPiano();
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const src = c.createMediaStreamSource(mic.stream);
    mic.analyser = c.createAnalyser(); mic.analyser.fftSize = 8192; mic.analyser.smoothingTimeConstant = 0;
    src.connect(mic.analyser);
    mic.buf = new Float32Array(8192);
    mic.det = new PolyDetector(c.sampleRate);
    mic.det.expected = t0 => expectedForDetector(t0);
    mic.det.applyCal(loadCal(c.sampleRate));
    applySens();
    mic.active = true; $('#btnMic').classList.add('on'); $('#btnMic').textContent = '🎤 Изключи'; $('#micBox').hidden = false;
    setStatus('🎤 Слушам. Засвири някоя нота, за да провериш дали те чувам.');
  } catch (err) { setStatus('Нямам достъп до микрофона: ' + err.message); }
}
function loadCal(sr) {
  const saved = store.get('cal', null);
  if (!saved || saved.sr !== sr) return null;
  return { ...saved, noiseSpec: saved.noiseSpec ? Float32Array.from(saved.noiseSpec) : null };
}
function updateCalButton() {
  const saved = store.get('cal', null);
  $('#btnCal').textContent = saved ? '🎚 Настройка ✓' : '🎚 Настройка';
  $('#btnCal').classList.toggle('on', !!saved);
  $('#btnCal').title = saved ? 'Има запазена настройка от ' + new Date(saved.at).toLocaleString('bg-BG') + '. Натисни, за да я направиш отново.' : 'Настрой слушането за твоето пиано и стая';
}
const dB = e => Math.round(10 * Math.log10(Math.max(e, 1e-12)));
function updateDiag() {
  const d = mic.det, cal = d.cal;
  $('#diag').textContent = cal
    ? `звук ${dB(d.level)} dB · шум ${dB(d.noiseE)} dB${cal.tune ? ` · пианото е ${cal.tune > 0 ? '+' : ''}${cal.tune} цента` : ''}`
    : `звук ${dB(d.level)} dB · шум ${dB(d.noiseE)} dB`;
}

const calib = { c: null, html: '' };
async function startCalibration() {
  if (!mic.active) { await toggleMic(); if (!mic.active) return; }
  if (S.playing) { S.playing = false; updateButtons(); }
  S.kbLo = Math.min(S.kbLo, 48); S.kbHi = Math.max(S.kbHi, 71);
  calib.c = new Calibrator(mic.det); calib.html = '';
  renderCalib();
}
function renderCalib() {
  const c = calib.c; if (!c) return;
  const now = nowSec();
  let body;
  if (c.phase === 'notes') {
    // the eight white keys from middle C, numbered in the order to play them
    const heard = c.lastHeard && performance.now() < c.heardUntil ? c.lastHeard : null;
    const hc = m => heard && heard.midi === m ? (heard.ok ? ' hg' : ' hb') : '';
    const whites = CAL_NOTES.map((m, i) => `<div class="w ${i < c.idx ? 'done' : i === c.idx ? 'cur' : ''}${hc(m)}"><span class="n">${i < c.idx ? '✓' : i + 1}</span>${midiName(m)}</div>`).join('');
    const blacks = [[1, 61], [2, 63], [4, 66], [5, 68], [6, 70]].map(([i, m]) => `<div class="b${hc(m)}" style="left:calc(var(--kw) * ${i} - var(--bw) / 2)"></div>`).join('');
    const keys = `<div class="mini">${whites}${blacks}</div><p class="mini-hint">Отляво надясно: 1 → 8 · сега: <b>${c.idx + 1}. ${midiName(c.target, true)}</b></p>`
      + (c.idx === 0 ? '<p class="mini-hint">Средното До е в средата на пианото, обикновено точно под името му: белият клавиш веднага вляво от двата черни.</p>' : '');
    const heardMsg = c.lastHeard
      ? (c.lastHeard.ok ? '<p class="ok">✓ Чух го!</p>' : `<p class="no">Чух ${midiName(c.lastHeard.midi)}. Сега ${midiName(c.target)}.</p>`)
      : (now - c.lastT > 7 ? '<p class="no">Не чувам нищо. Приближи устройството до пианото или свири по-силно.</p>' : '<p>&nbsp;</p>');
    body = `<h2>🎚 Настройка</h2><p>Изсвири тези клавиши един по един, нормално силно:</p>
      ${keys}${heardMsg}
      <div class="btns">${c.tries >= 3 ? '<button data-act="cal-skip">Пропусни тази нота</button>' : ''}<button data-act="cal-cancel">Отказ</button></div>`;
  } else {
    const cal = c.cal;
    const tuneTxt = Math.abs(cal.tune) < 5 ? 'Пианото е добре настроено.' : `Пианото е ${cal.tune > 0 ? 'по-високо' : 'по-ниско'} с ${Math.abs(cal.tune)} цента. Ще го имам предвид.`;
    const snr = cal.snrDb === null ? '' : cal.snrDb >= 25 ? 'Чувам пианото ясно.' : cal.snrDb >= 15 ? 'Чувам пианото, но стаята е шумна.' : 'Пианото се чува слабо. Приближи устройството.';
    const snrNum = cal.snrDb === null ? '' : `<p>Пианото е с <b>${cal.snrDb} dB</b> по-силно от шума в стаята.</p>`;
    body = `<h2>✓ Настройката е запазена</h2><p>${snr}</p>${snrNum}<p>${tuneTxt}</p>
      <div class="btns"><button class="primary" data-act="cal-done">Готово</button><button data-act="cal-redo">Отначало</button></div>`;
  }
  const html = `<div class="card">${body}</div>`;
  if (html !== calib.html) { calib.html = html; $('#calModal').innerHTML = html; $('#calModal').hidden = false; }
}
function endCalibration(saveIt) {
  const c = calib.c; calib.c = null; $('#calModal').hidden = true;
  if (saveIt && c && c.cal) store.set('cal', { ...c.cal, noiseSpec: c.cal.noiseSpec ? Array.from(c.cal.noiseSpec, v => +v.toPrecision(4)) : null, sr: mic.det.sr });
  mic.det.applyCal(loadCal(mic.det.sr));
  mic.det.probeMode = false;
  showOverlay('start'); updateDiag(); updateCalButton();
}

function applySens() { if (mic.det) mic.det.sens = 2 ** (($('#sens').value - 5) / 2.5); }
function expectedForDetector() {
  const set = new Set();
  for (const n of currentTargets()) set.add(n.midi);
  if (S.mode === 'wait' && S.playing) { // the group after the current one too (players run ahead)
    const g = nextGroupBeat();
    const after = S.notes.find(n => n.state === 'pending' && isActive(n) && n.beat > g + 1e-6);
    if (after) S.notes.filter(n => isActive(n) && Math.abs(n.beat - after.beat) < 1e-6).forEach(n => set.add(n.midi));
  }
  return set;
}
function processMic() {
  mic.analyser.getFloatTimeDomainData(mic.buf);
  const t = nowSec();
  if (calib.c) {
    calib.c.feed(mic.buf, t);
    for (const f of calib.c.flashes) S.flash.set(f.midi, { kind: f.ok ? 'good' : 'bad', until: performance.now() + 700 });
    calib.c.flashes = [];
    $('#meterFill').style.width = Math.min(100, Math.sqrt(mic.det.level) * 400) + '%';
    renderCalib(); return;
  }
  if (t - (mic.diagT || 0) > 0.5) { mic.diagT = t; updateDiag(); }
  const evs = mic.det.process(mic.buf, t);
  $('#meterFill').style.width = Math.min(100, Math.sqrt(mic.det.level) * 400) + '%';
  S.accompRecent = S.accompRecent.filter(a => t - a.t < 0.5);
  const strikes = new Map();
  for (const ev of evs) {
    if (S.demo) continue; // it is only hearing our own speakers
    if (S.accompRecent.some(a => (a.m - ev.midi) % 12 === 0 && ev.t - a.t > -0.05)) continue;
    mic.heard.push({ midi: ev.midi, t });
    if (!strikes.has(ev.t)) strikes.set(ev.t, []);
    strikes.get(ev.t).push(ev.midi);
  }
  for (const [t0, midis] of strikes) onStrike(midis, t0);
  mic.heard = mic.heard.filter(h => t - h.t < 1.2);
  const txt = mic.heard.length ? [...new Set(mic.heard.map(h => midiName(h.midi, true)))].join(' + ') : '—';
  if ($('#heard').textContent !== txt) $('#heard').textContent = txt;
}

/* ============================================================
   Drawing: grand staff
   ============================================================ */
const cv = $('#staff'), g = cv.getContext('2d');
const kb = $('#kb'), gk = kb.getContext('2d');
const L = 12, H = 6, T_TOP = 64, T_BOT = T_TOP + 4 * L, B_TOP = T_BOT + 5 * L, B_BOT = B_TOP + 4 * L;
const INK = { paper: '#fbf8f1', ink: '#1d1f2b', line: '#77757f', next: '#2f6bff', hit: '#17a34a', miss: '#dc3545', off: '#c4beb1', played: '#5a6b8c' };
let W = 800, CH = 290, PX = 200, PPB = 90, PANEL = 110;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; CH = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(CH * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  kb.width = Math.round(kb.clientWidth * dpr); kb.height = Math.round(kb.clientHeight * dpr); gk.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ks = S.song && S.song.key ? S.song.key.length : 0;
  PANEL = 76 + ks * 11 + (ks ? 6 : 0) + 30;
  PX = PANEL + (W < 700 ? 40 : 80);
  PPB = (W < 700 ? 62 : 88) * (S.song && S.song.zoom || 1);
}
const yOf = (diat, staff) => staff === 'T' ? T_BOT - (diat - 30) * H : B_TOP - (diat - 26) * H;
const staffOf = n => n.hand === 'L' ? 'B' : 'T';
const xOf = beat => PX + (beat - S.beat) * PPB;

function ledgerYs(diat, staff) {
  const out = [];
  if (staff === 'T') { for (let l = 28; l >= diat; l -= 2) out.push(yOf(l, 'T')); for (let l = 40; l <= diat; l += 2) out.push(yOf(l, 'T')); }
  else { for (let l = 16; l >= diat; l -= 2) out.push(yOf(l, 'B')); for (let l = 28; l <= diat; l += 2) out.push(yOf(l, 'B')); }
  return out;
}
function accidentalFor(n) {
  const k = (S.song.key || []).find(x => x[0] === n.letter);
  const keyAcc = k ? (k[1] === '#' ? 1 : -1) : 0;
  if (n.acc === keyAcc) return '';
  return n.acc > 0 ? '♯' : n.acc < 0 ? '♭' : '♮';
}
function drawHead(x, y, hollow, color) {
  g.fillStyle = color;
  g.beginPath(); g.ellipse(x, y, 7.2, 5.2, -0.35, 0, Math.PI * 2); g.fill();
  if (hollow) { g.fillStyle = INK.paper; g.beginPath(); g.ellipse(x, y, 4.6, 2.3, -0.6, 0, Math.PI * 2); g.fill(); }
}
function drawNote(n, x, color) {
  const staff = staffOf(n), y = yOf(n.diat, staff);
  g.strokeStyle = color === INK.off ? INK.off : INK.ink; g.lineWidth = 1.3;
  for (const ly of ledgerYs(n.diat, staff)) { g.beginPath(); g.moveTo(x - 11, ly); g.lineTo(x + 11, ly); g.stroke(); }
  const acc = accidentalFor(n);
  if (acc) { g.fillStyle = color; g.font = '18px serif'; g.textAlign = 'center'; g.fillText(acc, x - 17, y + 6); }
  const dotted = [0.75, 1.5, 3].includes(n.dur);
  const base = dotted ? n.dur / 1.5 : n.dur;
  drawHead(x, y, base >= 2, color);
  if (base < 4) {
    const up = staff === 'T' ? n.diat < 34 : n.diat < 22;
    const sx = up ? x + 6.4 : x - 6.4, sy = up ? y - 1 : y + 1, ey = up ? y - 38 : y + 38;
    g.strokeStyle = color; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx, ey); g.stroke();
    const flags = base <= 0.25 ? 2 : base <= 0.5 ? 1 : 0;
    g.lineWidth = 2.2;
    for (let f = 0; f < flags; f++) {
      const fy = up ? ey + f * 8 : ey - f * 8, d = up ? 1 : -1;
      g.beginPath(); g.moveTo(sx, fy); g.quadraticCurveTo(sx + 9, fy + d * 8, sx + 8, fy + d * 18); g.stroke();
    }
  }
  if (dotted) {
    const onLine = staff === 'T' ? (n.diat - 30) % 2 === 0 : (n.diat - 26) % 2 === 0;
    g.fillStyle = color; g.beginPath(); g.arc(x + 12, onLine ? y - 3 : y, 2, 0, Math.PI * 2); g.fill();
  }
  if ($('#optNames').checked) {
    g.fillStyle = color; g.font = '600 12px -apple-system,system-ui,sans-serif'; g.textAlign = 'center';
    g.fillText(noteName(n), x, staff === 'T' ? 18 : CH - 8);
  }
}
function staffLines(x0, x1) {
  g.strokeStyle = INK.line; g.lineWidth = 1;
  for (const top of [T_TOP, B_TOP]) for (let i = 0; i < 5; i++) {
    const y = top + i * L + 0.5; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  }
}
function drawStaff() {
  const now = performance.now(), song = S.song;
  g.fillStyle = INK.paper; g.fillRect(0, 0, W, CH);
  if (!song) return;

  // hit window (В темп) / waiting glow (Изчаква ме)
  if (S.mode === 'realtime' && !S.demo) {
    const w = HIT_WIN * bps() * PPB;
    g.fillStyle = 'rgba(47,107,255,.08)'; g.fillRect(PX - w, T_TOP - 30, 2 * w, B_BOT - T_TOP + 60);
  }
  staffLines(0, W);

  // bar lines
  const pk = song.pickup || 0;
  g.strokeStyle = INK.line; g.lineWidth = 1;
  for (let k = pk > 0 ? 0 : 1; ; k++) {
    const b = pk + k * song.bpb;
    if (b > S.endBeat + 1e-6) break;
    const x = xOf(b) - PPB * 0.35;
    if (x > W + 5) break;
    if (x < PANEL - 20) continue;
    const final = Math.abs(b - S.endBeat) < 1e-6;
    g.lineWidth = 1; g.beginPath(); g.moveTo(x, T_TOP); g.lineTo(x, B_BOT); g.stroke();
    if (final) { g.lineWidth = 4; g.beginPath(); g.moveTo(x + 5, T_TOP); g.lineTo(x + 5, B_BOT); g.stroke(); }
  }

  // playhead
  const pulse = S.waiting ? 0.55 + 0.45 * Math.sin(now / 160) : 0.9;
  g.strokeStyle = `rgba(47,107,255,${pulse})`; g.lineWidth = 3;
  g.beginPath(); g.moveTo(PX, T_TOP - 26); g.lineTo(PX, B_BOT + 26); g.stroke();

  // notes
  const targets = new Set(currentTargets());
  for (const n of S.notes) {
    const x = xOf(n.beat);
    if (x < PANEL - 30 || x > W + 30) continue;
    let color = INK.ink;
    if (n.state === 'hit') color = INK.hit;
    else if (n.state === 'miss') color = INK.miss;
    else if (n.state === 'played') color = INK.played;
    else if (!isActive(n) && !S.demo) color = INK.off;
    else if (targets.has(n)) color = INK.next;
    drawNote(n, x, color);
  }

  // wrong-note ghosts at the playhead
  S.ghosts = S.ghosts.filter(gh => now - gh.t < 600);
  for (const gh of S.ghosts) {
    const info = midiInfo(gh.midi), staff = gh.midi >= 60 ? 'T' : 'B';
    g.globalAlpha = 1 - (now - gh.t) / 600;
    drawHead(PX, yOf(info.diat, staff), false, INK.miss);
    g.globalAlpha = 1;
  }
  // floating feedback between the staves
  S.feedback = S.feedback.filter(f => now - f.t < 800);
  g.textAlign = 'right'; g.font = '700 15px -apple-system,system-ui,sans-serif';
  for (const f of S.feedback) {
    const a = (now - f.t) / 800;
    g.globalAlpha = 1 - a; g.fillStyle = f.color;
    g.fillText(f.text, PX - 10, (T_BOT + B_TOP) / 2 + 5 - a * 14);
  }
  g.globalAlpha = 1;

  // left panel: clefs, key and time signature (notes fade under it)
  const grad = g.createLinearGradient(PANEL, 0, PANEL + 30, 0);
  grad.addColorStop(0, INK.paper); grad.addColorStop(1, 'rgba(251,248,241,0)');
  g.fillStyle = INK.paper; g.fillRect(0, 0, PANEL, CH);
  g.fillStyle = grad; g.fillRect(PANEL, 0, 30, CH);
  staffLines(8, PANEL + 30);
  g.strokeStyle = INK.ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(8, T_TOP); g.lineTo(8, B_BOT + 1); g.stroke();
  g.fillStyle = INK.ink; g.textAlign = 'left';
  g.font = '62px "Apple Symbols","Noto Music","Segoe UI Symbol",serif';
  g.fillText('𝄞', 14, T_BOT + 11);
  g.font = '42px "Apple Symbols","Noto Music","Segoe UI Symbol",serif';
  g.fillText('𝄢', 16, B_TOP + 31);
  const key = song.key || [];
  g.font = '20px serif';
  // standard placement, in the order the key signature adds them
  const KS = { '#': [[38, 35, 39, 36, 33, 37, 34], [24, 21, 25, 22, 19, 23, 20]], b: [[34, 37, 33, 36, 32, 35, 31], [20, 23, 19, 22, 18, 21, 17]] };
  key.forEach((k, i) => {
    const [pt, pb] = KS[k[1]], x = 62 + i * 11, sym = k[1] === '#' ? '♯' : '♭';
    g.fillText(sym, x, yOf(pt[i], 'T') + 7); g.fillText(sym, x, yOf(pb[i], 'B') + 7);
  });
  const [tsTop, tsBot] = (song.ts || `${song.bpb}/4`).split('/');
  const tx = 68 + key.length * 11 + (key.length ? 6 : 0);
  g.font = '700 25px Georgia,serif'; g.textAlign = 'center';
  for (const top of [T_TOP, B_TOP]) { g.fillText(tsTop, tx, top + 2 * L - 2); g.fillText(tsBot, tx, top + 4 * L - 2); }
}

/* ============================================================
   Drawing: keyboard
   ============================================================ */
const IS_BLACK = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
function kbLayout() {
  const w = kb.clientWidth, h = kb.clientHeight;
  const whites = []; for (let m = S.kbLo; m <= S.kbHi; m++) if (!IS_BLACK[m % 12]) whites.push(m);
  const ww = w / whites.length, bw = ww * 0.62, bh = h * 0.62;
  const keys = [];
  whites.forEach((m, i) => keys.push({ m, x: i * ww, w: ww, h, black: false }));
  for (let m = S.kbLo; m <= S.kbHi; m++) if (IS_BLACK[m % 12]) {

async function renderScene(len, sr, seed, fill, roomOpts) {

}
function runDetector(det, x, sr, onEvents) {

}
// the setup, done offline: 3 s of room noise, then C4, G4, C3 like the user would play them
async function calibrateOffline({ gain = 0.15, detune = 0, seed = 7, room = 0.008, reverb = 0.35 } = {}) {
  audio(); await loadPiano();
  const sr = 48000, len = sr * 10;
  const x = await renderScene(len, sr, seed, (oc, input) => {
    CAL_NOTES.forEach((m, i) => playNote(m, 0.9, 1.6 + i * 1.0, 0.6, oc, input, detune));
  }, { room, reverb, gain });
  const det = new PolyDetector(sr), cal = new Calibrator(det);
  const sx = new Float32Array(len); sx.set(x);
  for (let e = det.N; e <= len && cal.phase !== 'done'; e += 800) cal.feed(sx.subarray(e - det.N, e), e / sr);

}
async function selfTest(id, { hands = 'both', jitter = 0.015, wrong = 0, guided = true, bpm = null, seed = 1, gain = 0.15, detune = 0, room = 0.008, reverb = 0.35, calibrate = true } = {}) {
  audio(); await loadPiano();
  const song = allSongs().find(s => s.id === id);
  const notes = buildNotes(song).filter(n => hands === 'both' || n.hand === hands);
  const spb = 60 / (bpm || song.bpm), lead = 1.0, sr = 48000;
  const end = Math.max(...notes.map(n => n.beat + n.dur));
  const len = Math.ceil((lead + end * spb + 1.5) * sr);
  const truth = [];
  const x = await renderScene(len, sr, seed, (oc, input, rnd) => {
    for (const n of notes) {
      const t = lead + n.beat * spb + (rnd() - 0.5) * 2 * jitter;
      let m = n.midi, isWrong = false;
      if (rnd() < wrong) { m += rnd() < 0.5 ? -2 : 1; isWrong = true; }
      playNote(m, n.dur * spb, t, 0.35 + 0.45 * rnd(), oc, input, detune);
      truth.push({ t, m, orig: n.midi, isWrong });
    }
  }, { room, reverb, gain });
  const det = new PolyDetector(sr);
  if (calibrate) { const c = await calibrateOffline({ gain, detune, room, reverb }); if (c.cal) det.applyCal(c.cal); }
  if (guided) det.expected = t0 => new Set(truth.filter(tr => Math.abs(tr.t - t0) < 0.12).map(tr => tr.orig));
  const evs = []; runDetector(det, x, sr, e => evs.push(...e));
  const used = new Set(); let exact = 0, octave = 0; const missed = [];
  const find = (tr, ok) => evs.findIndex((ev, i) => !used.has(i) && ev.t - tr.t > -0.03 && ev.t - tr.t < 0.1 && ok(ev));
  for (const tr of truth) {
    let i = find(tr, ev => ev.midi === tr.m);
    if (i >= 0) { used.add(i); exact++; continue; }
    i = find(tr, ev => (ev.midi - tr.m) % 12 === 0);
    if (i >= 0) { used.add(i); octave++; continue; }
    missed.push(tr);
  }
  const strikeTimes = [...new Set(evs.map(e => e.t))];
  const wrongT = strikeTimes.filter(t0 => !evs.some((e, i) => e.t === t0 && used.has(i)));
  return {
    notes: truth.length, exact, octave, missed: missed.length, strikes: strikeTimes.length, wrongStrikes: wrongT.length,
    tune: det.cal ? det.cal.tune : null,
    missList: missed.slice(0, 8).map(m => midiName(m.m, true) + '@' + m.t.toFixed(2)),
    wrongList: wrongT.slice(0, 8).map(t0 => evs.filter(e => e.t === t0).map(e => midiName(e.midi, true)).join('+') + '@' + t0.toFixed(2)),
  };
}
// nobody plays; the game waits for notes; how often does the room "play" them?
async function noiseTest(kind, { secs = 20, level = 0.05, expected = [60, 64, 67, 48], seed = 3, calibrate = true, room = 0.008 } = {}) {
  audio(); await loadPiano();
  const sr = 48000, len = sr * secs;
  const x = await renderScene(len, sr, seed, (oc, input, rnd) => { if (kind !== 'fan') addNoise(oc, len, rnd, kind, level); }, { room });
  const det = new PolyDetector(sr);
  if (calibrate) { const c = await calibrateOffline({ room }); if (c.cal) det.applyCal(c.cal); }
  const set = new Set(expected); det.expected = () => set;
  const evs = []; runDetector(det, x, sr, e => evs.push(...e));
  return { kind, onsets: det.onsets || 0, falseNotes: evs.length, expectedHits: evs.filter(e => set.has(e.midi)).length, list: evs.slice(0, 8).map(e => midiName(e.midi, true) + '@' + e.t.toFixed(2)) };
}
